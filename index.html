<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard คาดการณ์ผู้เกษียณอายุ</title>
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- นำเข้า React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- นำเข้า Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- นำเข้า SheetJS สำหรับอ่านไฟล์ Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <!-- นำเข้า Recharts สำหรับวาดกราฟ -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

        const COLORS = ['#0088FE', '#00C49F', '#FFBB28', '#FF8042', '#8884d8'];

        function App() {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedFaculty, setSelectedFaculty] = useState('ทั้งหมด');
            const [error, setError] = useState(null);

            useEffect(() => {
                const fetchData = async () => {
                    try {
                        // เปลี่ยนชื่อไฟล์ตรงนี้เป็น Data.xlsx
                        const response = await fetch('./Data.xlsx');
                        if (!response.ok) throw new Error('ไม่พบไฟล์ Excel');
                        
                        const arrayBuffer = await response.arrayBuffer();
                        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet);
                        
                        // กรองข้อมูลเฉพาะปี 2569 เป็นต้นไป
                        const futureRetirees = jsonData.filter(row => row['ปีเกษียณ'] >= 2569);
                        setData(futureRetirees);
                        setLoading(false);
                    } catch (err) {
                        console.error(err);
                        setError('ไม่สามารถอ่านไฟล์ Data.xlsx ได้ กรุณาตรวจสอบว่ามีไฟล์นี้อยู่ในระดับเดียวกับ index.html');
                        setLoading(false);
                    }
                };
                fetchData();
            }, []);

            const faculties = useMemo(() => {
                const unique = [...new Set(data.map(item => item['คณะ/สำนัก']).filter(Boolean))];
                return ['ทั้งหมด', ...unique.sort()];
            }, [data]);

            const filteredData = useMemo(() => {
                return selectedFaculty === 'ทั้งหมด' 
                    ? data 
                    : data.filter(item => item['คณะ/สำนัก'] === selectedFaculty);
            }, [data, selectedFaculty]);

            const retireByYear = useMemo(() => {
                const counts = {};
                filteredData.forEach(item => {
                    const year = item['ปีเกษียณ'];
                    if (year && year <= 2579) { // 10 ปีล่วงหน้า
                        counts[year] = (counts[year] || 0) + 1;
                    }
                });
                return Object.keys(counts).sort().map(year => ({
                    name: year,
                    จำนวน: counts[year]
                }));
            }, [filteredData]);

            const retireByTrack = useMemo(() => {
                const counts = {};
                filteredData.forEach(item => {
                    const track = item['สรุปสายงาน'] || 'ไม่ระบุ';
                    counts[track] = (counts[track] || 0) + 1;
                });
                return Object.keys(counts).map(track => ({
                    name: track,
                    value: counts[track]
                }));
            }, [filteredData]);

            if (error) return <div className="p-10 text-red-500 font-bold text-center">{error}</div>;
            if (loading) return <div className="p-10 text-center text-xl">กำลังโหลดข้อมูล...</div>;

            return (
                <div className="p-6 max-w-7xl mx-auto min-h-screen">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h1 className="text-3xl font-bold text-gray-800">Dashboard คาดการณ์ผู้เกษียณอายุ (10 ปี)</h1>
                        <select 
                            className="p-2 border border-gray-300 rounded-md shadow-sm bg-white font-medium min-w-[200px]"
                            value={selectedFaculty}
                            onChange={(e) => setSelectedFaculty(e.target.value)}
                        >
                            {faculties.map(faculty => (
                                <option key={faculty} value={faculty}>{faculty}</option>
                            ))}
                        </select>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p className="text-sm text-gray-500 mb-1">จำนวนผู้เกษียณทั้งหมด</p>
                            <p className="text-3xl font-bold text-blue-600">{filteredData.length} ท่าน</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p className="text-sm text-gray-500 mb-1">สายวิชาการ</p>
                            <p className="text-3xl font-bold text-orange-500">
                                {filteredData.filter(d => d['สรุปสายงาน'] === 'สายวิชาการ').length} ท่าน
                            </p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <p className="text-sm text-gray-500 mb-1">สายวิชาชีพ</p>
                            <p className="text-3xl font-bold text-green-500">
                                {filteredData.filter(d => d['สรุปสายงาน'] === 'สายวิชาชีพ').length} ท่าน
                            </p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h2 className="text-lg font-semibold mb-6 text-gray-700">แนวโน้มการเกษียณอายุรายปี</h2>
                            <div className="h-80">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={retireByYear}>
                                        <CartesianGrid strokeDasharray="3 3" opacity={0.3} />
                                        <XAxis dataKey="name" />
                                        <YAxis />
                                        <Tooltip />
                                        <Bar dataKey="จำนวน" fill="#4F46E5" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h2 className="text-lg font-semibold mb-6 text-gray-700">สัดส่วนผู้เกษียณแยกตามสายงาน</h2>
                            <div className="h-80">
                                <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                        <Pie
                                            data={retireByTrack}
                                            cx="50%"
                                            cy="50%"
                                            innerRadius={60}
                                            outerRadius={100}
                                            paddingAngle={5}
                                            dataKey="value"
                                            label={({ name, percent }) => `${name} ${(percent * 100).toFixed(0)}%`}
                                        >
                                            {retireByTrack.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                            ))}
                                        </Pie>
                                        <Tooltip />
                                        <Legend />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
